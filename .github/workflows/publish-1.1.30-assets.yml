name: Publish TikLive Control 1.1.30 assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-da98-8211-b61e-fee83dfc4fcb/raw?se=2026-08-13T13%3A42%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=8736babb-a387-469b-9905-17115eead3a8&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T02%3A09%3A52Z&ske=2026-08-14T02%3A09%3A52Z&sks=b&skv=2026-02-06&sig=y6Di9l4TQQM%2BnDP4U5VUBf10G5kuxSnGYLYkKq5u5zc%3D"
      ARTIFACT_SHA256: "f47c8778089bf6a0ad34d5f2bbd04f6612abbf279c1b91677ef9c8c20228125a"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors "$ARTIFACT_URL" --output release-artifact.zip
          echo "$ARTIFACT_SHA256  release-artifact.zip" | sha256sum --check
          unzip -q release-artifact.zip -d release-assets
          find release-assets -type f -maxdepth 3 -print

          for name in             TikLive-Control-1.1.30-x64.exe             TikLive-Control-1.1.30-x64.exe.blockmap             latest.yml             TikLive-Control-1.1.30-x64.exe.sha256.txt
          do
            path="$(find release-assets -type f -name "$name" -print -quit)"
            test -n "$path"
            cp "$path" "$name"
          done

          sha256sum --check TikLive-Control-1.1.30-x64.exe.sha256.txt
          grep -q '^version: 1.1.30$' latest.yml
          grep -q 'TikLive-Control-1.1.30-x64.exe' latest.yml

      - name: Publish OTA release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            TikLive-Control-1.1.30-x64.exe
            TikLive-Control-1.1.30-x64.exe.blockmap
            latest.yml
            TikLive-Control-1.1.30-x64.exe.sha256.txt
          )
          if gh release view v1.1.30 >/dev/null 2>&1; then
            gh release upload v1.1.30 "${assets[@]}" --clobber
            gh release edit v1.1.30 --latest --title "TikLive Control Desktop v1.1.30"
          else
            gh release create v1.1.30 "${assets[@]}"               --target main               --latest               --title "TikLive Control Desktop v1.1.30"               --notes "Centralized Web Billing V2; removed local PayOS SDK/secrets/webhooks; secure checkout polling; Main bytecode and packaged gates retained. Authenticode NotSigned for approved QA."
          fi

      - name: Remove temporary publisher workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "theanhnt911-tech"
          git config user.email "theanhnt911@gmail.com"
          git rm ".github/workflows/publish-1.1.30-assets.yml"
          git commit -m "chore: finalize TikLive Control 1.1.30 OTA release"
          git push origin HEAD:main
